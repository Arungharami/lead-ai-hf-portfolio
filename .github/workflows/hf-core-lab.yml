name: Hugging Face Core Lab

on:
  pull_request:
    paths:
      - "core-development/**"
      - ".github/workflows/hf-core-lab.yml"
  push:
    branches: [main]
    paths:
      - "core-development/**"
      - ".github/workflows/hf-core-lab.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core-development/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
